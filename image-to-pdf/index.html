<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>Image to PDF Converter</title>
        <link rel="icon" type="image/webp" href="/favicon.webp" />
        <link rel="stylesheet" href="../style.css" />
        <script src="./jspdf.umd.min.js"></script>
        <style>
            .controls-card {
                background: var(--card-bg);
                padding: 20px;
                border-radius: 12px;
                border: 1px solid rgba(255, 255, 255, 0.05);
                margin-bottom: 20px;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .form-group label {
                font-size: 0.85rem;
                font-weight: 700;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .form-row {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            select,
            input[type="range"] {
                width: 100%;
                background: var(--entry-bg);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 8px;
                color: #fff;
                padding: 10px 12px;
                font-size: 0.9rem;
                outline: none;
                transition: border-color 0.2s;
            }

            select:focus {
                border-color: var(--accent);
            }

            .range-container {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .range-value {
                font-weight: 700;
                min-width: 40px;
                font-size: 0.9rem;
            }

            .drop-zone {
                border: 2px dashed rgba(255, 255, 255, 0.2);
                border-radius: 12px;
                padding: 30px 20px;
                text-align: center;
                background: rgba(0, 0, 0, 0.1);
                cursor: pointer;
                transition: all 0.2s;
                margin-bottom: 24px;
            }

            .drop-zone:hover,
            .drop-zone.dragover {
                border-color: var(--accent);
                background: rgba(53, 132, 228, 0.05);
            }

            .drop-zone-text {
                font-weight: 600;
                color: var(--text-muted);
                font-size: 0.95rem;
            }

            /* A4 Sayfa Önizleme Izgarası */
            .image-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 20px;
                margin-bottom: 24px;
            }

            /* A4 Sayfa Görünümündeki Kart */
            .a4-page-card {
                background: #ffffff;
                border-radius: 4px;
                aspect-ratio: 1 / 1.4142; /* A4 Oranı */
                position: relative;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 8px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
                cursor: grab;
                user-select: none;
                transition:
                    transform 0.2s,
                    box-shadow 0.2s;
                overflow: hidden;
            }

            .a4-page-card:active {
                cursor: grabbing;
            }

            .a4-page-card.dragging {
                opacity: 0.4;
            }

            .a4-page-card:hover {
                transform: translateY(-4px);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            }

            .img-preview-container {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                background: #f8f9fa;
                border-radius: 2px;
            }

            .img-preview {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }

            .a4-header {
                position: absolute;
                top: 8px;
                left: 8px;
                right: 8px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 2;
                pointer-events: none;
            }

            .badge-page {
                background: rgba(30, 30, 30, 0.85);
                color: #fff;
                font-size: 0.75rem;
                padding: 3px 8px;
                border-radius: 6px;
                font-weight: 700;
                backdrop-filter: blur(4px);
            }

            .a4-footer-actions {
                position: absolute;
                bottom: 8px;
                left: 8px;
                right: 8px;
                display: flex;
                justify-content: space-between;
                gap: 4px;
                z-index: 2;
                background: rgba(30, 30, 30, 0.85);
                padding: 4px;
                border-radius: 8px;
                backdrop-filter: blur(4px);
                opacity: 0.9;
                transition: opacity 0.2s;
            }

            .a4-page-card:hover .a4-footer-actions {
                opacity: 1;
            }

            .btn-icon {
                padding: 6px 10px;
                font-size: 0.8rem;
                border-radius: 6px;
                background: var(--entry-bg);
                color: white;
                border: none;
                cursor: pointer;
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .btn-icon:hover {
                background: #4a4a4a;
            }

            .btn-danger {
                background-color: #e01b24;
            }

            .btn-danger:hover {
                background-color: #c0151d;
            }

            @media (max-width: 768px) {
                .form-row {
                    grid-template-columns: 1fr;
                }
                .image-grid {
                    grid-template-columns: repeat(
                        auto-fill,
                        minmax(130px, 1fr)
                    );
                    gap: 12px;
                }
                .a4-footer-actions {
                    opacity: 1;
                    padding: 2px;
                }
                .btn-icon {
                    padding: 4px 6px;
                    font-size: 0.75rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <a href="/" class="back-link">← Back to Tools</a>
            <header>
                <h1>Image to PDF</h1>
                <p class="subtitle">
                    Convert images into A4 PDF pages with JPEG quality control.
                </p>
            </header>

            <div class="controls-card">
                <div class="form-row">
                    <div class="form-group">
                        <label for="pageSize">Page Layout</label>
                        <select id="pageSize">
                            <option value="a4" selected>
                                A4 (Fit Content)
                            </option>
                            <option value="fit">
                                Original Image Dimensions
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="imgQuality">JPEG Quality</label>
                        <div class="range-container">
                            <input
                                type="range"
                                id="imgQuality"
                                min="0.1"
                                max="1.0"
                                step="0.05"
                                value="0.85"
                                oninput="updateQualityVal(this.value)"
                            />
                            <span id="qualityVal" class="range-value">85%</span>
                        </div>
                    </div>
                </div>
            </div>

            <div
                class="drop-zone"
                id="dropZone"
                onclick="document.getElementById('fileInput').click()"
            >
                <div class="drop-zone-text">
                    Drag & drop images here or
                    <span style="color: var(--accent)">browse</span>
                </div>
                <input
                    type="file"
                    id="fileInput"
                    multiple
                    accept="image/*"
                    style="display: none"
                    onchange="handleFiles(this.files)"
                />
            </div>

            <div class="image-grid" id="imageGrid"></div>

            <div class="btn-group">
                <button
                    class="btn-accent"
                    id="convertBtn"
                    onclick="generatePDF()"
                    disabled
                >
                    Download PDF
                </button>
                <button class="btn-secondary" onclick="clearAll()">
                    Clear All
                </button>
            </div>
        </div>

        <script>
            let images = [];
            const imageGrid = document.getElementById("imageGrid");
            const convertBtn = document.getElementById("convertBtn");

            const dropZone = document.getElementById("dropZone");

            dropZone.addEventListener("dragover", (e) => {
                e.preventDefault();
                dropZone.classList.add("dragover");
            });

            dropZone.addEventListener("dragleave", () => {
                dropZone.classList.remove("dragover");
            });

            dropZone.addEventListener("drop", (e) => {
                e.preventDefault();
                dropZone.classList.remove("dragover");
                if (e.dataTransfer.files.length) {
                    handleFiles(e.dataTransfer.files);
                }
            });

            function updateQualityVal(val) {
                document.getElementById("qualityVal").innerText =
                    Math.round(val * 100) + "%";
            }

            function handleFiles(files) {
                const fileArray = Array.from(files).filter((file) =>
                    file.type.startsWith("image/"),
                );

                let loadedCount = 0;
                fileArray.forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = new Image();
                        img.onload = () => {
                            images.push({
                                id: Math.random().toString(36).substring(2, 9),
                                src: e.target.result,
                                width: img.width,
                                height: img.height,
                                element: img,
                            });
                            loadedCount++;
                            if (loadedCount === fileArray.length) {
                                renderGrid();
                            }
                        };
                        img.src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                });
            }

            function renderGrid() {
                imageGrid.innerHTML = "";
                images.forEach((item, index) => {
                    const card = document.createElement("div");
                    card.className = "a4-page-card";
                    card.draggable = true;
                    card.dataset.index = index;

                    card.innerHTML = `
                        <div class="a4-header">
                            <span class="badge-page">Page ${index + 1}</span>
                        </div>
                        <div class="img-preview-container">
                            <img src="${item.src}" class="img-preview" alt="A4 Page Preview" />
                        </div>
                        <div class="a4-footer-actions">
                            <button class="btn-icon" onclick="moveItem(${index}, -1)" title="Move Left">←</button>
                            <button class="btn-icon btn-danger" onclick="removeItem(${index})" title="Delete Page">✕</button>
                            <button class="btn-icon" onclick="moveItem(${index}, 1)" title="Move Right">→</button>
                        </div>
                    `;

                    card.addEventListener("dragstart", handleDragStart);
                    card.addEventListener("dragover", handleDragOver);
                    card.addEventListener("drop", handleDrop);
                    card.addEventListener("dragend", handleDragEnd);

                    imageGrid.appendChild(card);
                });

                convertBtn.disabled = images.length === 0;
            }

            let draggedIndex = null;

            function handleDragStart(e) {
                draggedIndex = parseInt(this.dataset.index);
                this.classList.add("dragging");
            }

            function handleDragOver(e) {
                e.preventDefault();
            }

            function handleDrop(e) {
                e.preventDefault();
                const targetIndex = parseInt(this.dataset.index);
                if (draggedIndex !== null && draggedIndex !== targetIndex) {
                    const movedItem = images.splice(draggedIndex, 1)[0];
                    images.splice(targetIndex, 0, movedItem);
                    renderGrid();
                }
            }

            function handleDragEnd() {
                this.classList.remove("dragging");
                draggedIndex = null;
            }

            function moveItem(index, direction) {
                const newIndex = index + direction;
                if (newIndex >= 0 && newIndex < images.length) {
                    const temp = images[index];
                    images[index] = images[newIndex];
                    images[newIndex] = temp;
                    renderGrid();
                }
            }

            function removeItem(index) {
                images.splice(index, 1);
                renderGrid();
            }

            function clearAll() {
                images = [];
                renderGrid();
                document.getElementById("fileInput").value = "";
            }

            async function generatePDF() {
                if (images.length === 0) return;

                const { jsPDF } = window.jspdf;
                const pageSizeMode = document.getElementById("pageSize").value;
                const quality = parseFloat(
                    document.getElementById("imgQuality").value,
                );

                let pdf = null;

                for (let i = 0; i < images.length; i++) {
                    const imgObj = images[i];

                    const canvas = document.createElement("canvas");
                    canvas.width = imgObj.width;
                    canvas.height = imgObj.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(imgObj.element, 0, 0);

                    const jpegUrl = canvas.toDataURL("image/jpeg", quality);

                    if (pageSizeMode === "fit") {
                        const orientation =
                            imgObj.width > imgObj.height
                                ? "landscape"
                                : "portrait";
                        if (i === 0) {
                            pdf = new jsPDF({
                                orientation: orientation,
                                unit: "px",
                                format: [imgObj.width, imgObj.height],
                            });
                        } else {
                            pdf.addPage(
                                [imgObj.width, imgObj.height],
                                orientation,
                            );
                        }
                        pdf.addImage(
                            jpegUrl,
                            "JPEG",
                            0,
                            0,
                            imgObj.width,
                            imgObj.height,
                        );
                    } else {
                        if (i === 0) {
                            pdf = new jsPDF("portrait", "mm", "a4");
                        } else {
                            pdf.addPage("a4", "portrait");
                        }

                        const pageWidth = pdf.internal.pageSize.getWidth();
                        const pageHeight = pdf.internal.pageSize.getHeight();

                        const imgRatio = imgObj.width / imgObj.height;
                        const pageRatio = pageWidth / pageHeight;

                        let printWidth, printHeight;

                        if (imgRatio > pageRatio) {
                            printWidth = pageWidth;
                            printHeight = pageWidth / imgRatio;
                        } else {
                            printHeight = pageHeight;
                            printWidth = pageHeight * imgRatio;
                        }

                        const xOffset = (pageWidth - printWidth) / 2;
                        const yOffset = (pageHeight - printHeight) / 2;

                        pdf.addImage(
                            jpegUrl,
                            "JPEG",
                            xOffset,
                            yOffset,
                            printWidth,
                            printHeight,
                        );
                    }
                }

                pdf.save("converted_document.pdf");
            }
        </script>
    </body>
</html>
